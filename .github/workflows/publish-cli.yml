name: Publish JustMemo CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "需要恢复发布的 cli-v* Tag"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI package
        run: npm run check:cli
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_key"
          ADMIN_PASSWORD: "mock_password"

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            cli-v*) ;;
            *) echo "Invalid CLI release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          package_version="$(node -p \"require('./cli/package.json').version\")"
          tag_version="${RELEASE_TAG#cli-v}"
          test "$tag_version" = "$package_version"

      - name: Publish to npm
        working-directory: cli
        run: npm publish
